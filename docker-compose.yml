services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/usr/src/sinel_web/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      - db
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data_v17:/var/lib/postgresql/data/
    env_file:
      - ./.env.dev

volumes:
  postgres_data_v17: null
