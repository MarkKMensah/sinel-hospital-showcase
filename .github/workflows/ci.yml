name: Regression and security checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: 'localhost 127.0.0.1 testserver'
      SQL_ENGINE: django.db.backends.sqlite3
      SQL_DATABASE: ':memory:'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run all regression tests
        run: python manage.py test --noinput
      - name: Check banner carousel behavior
        run: node --test tests/hero_carousel.test.cjs
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan Python security issues
        run: python -m bandit -r accounts blog communications dashboard rest_api_v1 sinel_web website -ll -ii
