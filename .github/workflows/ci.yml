name: Regression and security checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: sinel_web.settings.testing
      DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: 'localhost 127.0.0.1 testserver'
      SQL_ENGINE: django.db.backends.sqlite3
      SQL_DATABASE: ':memory:'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check the public snapshot boundary
        run: |
          python tools/check_public_snapshot.py --unit-tests
          python tools/check_public_snapshot.py --tree HEAD
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run all regression tests
        run: python manage.py test --noinput
      - name: Check dashboard and banner behavior
        run: node --test tests/*.test.cjs
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan Python security issues
        run: python -m bandit -r accounts blog communications dashboard rest_api_v1 sinel_web website -ll -ii
      - name: Build and start the demo container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t sinel-ci-demo .
          trap 'docker rm -f sinel-ci-startup >/dev/null 2>&1 || true' EXIT
          docker run --detach --name sinel-ci-startup --network none \
            --memory 256m \
            -e DEBUG=True -e DJANGO_ALLOWED_HOSTS=localhost \
            -e SQL_ENGINE=django.db.backends.sqlite3 \
            -e SQL_DATABASE=/tmp/sinel-ci.sqlite3 \
            sinel-ci-demo \
            gunicorn sinel_web.wsgi:application --bind 0.0.0.0:8000
          ready=0
          for attempt in {1..30}; do
            if docker exec sinel-ci-startup python -c \
              'from urllib.request import urlopen; assert urlopen("http://localhost:8000/", timeout=5).status == 200'; then
              ready=1
              break
            fi
            sleep 2
          done
          docker logs sinel-ci-startup
          test "$ready" -eq 1
          docker exec sinel-ci-startup python manage.py migrate --check
          docker exec sinel-ci-startup python manage.py check
          if docker run --rm --network none --memory 256m \
            -e DEBUG=True -e SQL_ENGINE=django.db.backends.sqlite3 \
            -e SQL_DATABASE=/nonexistent-directory/sinel-ci.sqlite3 \
            sinel-ci-demo python -c 'print("ENTRYPOINT_BYPASSED_FAILURE")' \
            > startup-failure.log 2>&1; then
            cat startup-failure.log
            exit 1
          fi
          if grep -q ENTRYPOINT_BYPASSED_FAILURE startup-failure.log; then
            cat startup-failure.log
            exit 1
          fi

  postgres-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sinel_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: sinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinel_test -d sinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: sinel_web.settings.testing
      SINEL_TEST_POSTGRES: '1'
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: sinel_test
      SQL_USER: sinel_test
      SQL_PASSWORD: isolated-ci-only
      SQL_HOST: 127.0.0.1
      SQL_PORT: '5432'
      PGOPTIONS: '-c lock_timeout=10000 -c statement_timeout=30000'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL regression and populated migration checks
        run: python manage.py test --noinput
