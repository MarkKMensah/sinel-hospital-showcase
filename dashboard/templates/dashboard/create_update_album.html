{% extends 'dashboard/base_template.html' %}
{% block gallery-page-active %}mm-active{% endblock %}
{% block pagetitle %}Album{% endblock %}
{% block content %}
<div class="app-main__inner">
  <div class="app-page-title"><div class="page-title-heading"><div>Album<div class="page-title-subheading">Group related gallery images.</div></div></div></div>
  <div class="main-card mb-3 card"><div class="card-body col-lg-8 mx-auto">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="album_id" value="{{ album.pk|default_if_none:'' }}">
      {% include 'dashboard/editor_fields.html' %}
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
  </div></div>
</div>
{% endblock %}
